apiVersion: apps/v1
kind: Deployment
metadata:
  name: visit-counter-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: visit-counter-web
  template:
    metadata:
      labels:
        app: visit-counter-web
    spec:
      containers:
        - name: web
          image: cberry1914/visit-counter:v1
          ports:
            - containerPort: 5000
          env:
            - name: REDIS_HOST
              value: redis
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app: redis
  ports:
    - port: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: visit-counter-web
spec:
  type: LoadBalancer
  selector:
    app: visit-counter-web
  ports:
    - port: 80
      targetPort: 5000